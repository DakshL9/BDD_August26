<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blood Donation Drive 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
  }
  @keyframes bagPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .bag-pulse { animation: bagPulse 1.8s ease-in-out infinite; }
  .theme-banner {
    background: linear-gradient(135deg, #fff5f2, #ffe1e6);
    border: 3px solid #c41f36;
  }
  @keyframes bubbleRise {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    12%  { opacity: 0.85; }
    88%  { opacity: 0.5; }
    100% { transform: translateY(-135%) scale(1); opacity: 0; }
  }
  .bubble {
    position: absolute;
    bottom: 2px;
    width: 5px;
    height: 5px;
    border-radius: 9999px;
    background: rgba(255,255,255,0.55);
    animation: bubbleRise 3.2s ease-in infinite;
    pointer-events: none;
  }
  .bg-video {
    position: fixed;
    inset: 0;
    z-index: -10;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: cover;
    object-position: center;
    display: block;
  }
</style>
</head>
<body class="bg-neutral-950">

  <!-- background video: replace src with your .mp4, or rename your file to background.mp4
       and place it in the same folder as this HTML file -->
  <video
    autoplay
    muted
    loop
    playsinline
    class="bg-video"
  >
    <source src="assets/BDD_August2026_BG.mp4" type="video/mp4" />
  </video>
  <!-- dark overlay so the tubes/text stay readable over the footage -->
  <div class="fixed inset-0 -z-10 bg-black/20"></div>


  <div class="relative z-10 flex min-h-screen flex-col items-center justify-center p-6">

    <div id="hub" class="relative z-20 mb-[-28px] flex -translate-y-[30px] justify-center">
      <div class="theme-banner relative flex flex-col items-center rounded-[28px] px-10 py-4 shadow-lg">
        <div class="flex items-center gap-2">
          <svg width="34" height="40" viewBox="0 0 34 40" class="shrink-0">
            <path d="M17 2 C17 2 3 18 3 26 a14 14 0 0 0 28 0 C31 18 17 2 17 2 Z" fill="#c41f36" />
            <path d="M17 2 C17 2 3 18 3 26 a14 14 0 0 0 28 0 C31 18 17 2 17 2 Z" fill="url(#dropShine)" />
            <ellipse cx="11.5" cy="23" rx="3.2" ry="4.4" fill="#ffffff" opacity="0.35" />
            <defs>
              <linearGradient id="dropShine" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff6b81" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#a81529" stop-opacity="0.55" />
              </linearGradient>
            </defs>
          </svg>
          <span class="text-4xl font-black uppercase leading-none tracking-tight text-[#a81529] md:text-5xl">Blood</span>
          <svg width="34" height="40" viewBox="0 0 34 40" class="shrink-0">
            <path d="M17 2 C17 2 3 18 3 26 a14 14 0 0 0 28 0 C31 18 17 2 17 2 Z" fill="#c41f36" />
            <path d="M17 2 C17 2 3 18 3 26 a14 14 0 0 0 28 0 C31 18 17 2 17 2 Z" fill="url(#dropShine)" />
            <ellipse cx="11.5" cy="23" rx="3.2" ry="4.4" fill="#ffffff" opacity="0.35" />
            <defs>
              <linearGradient id="dropShine" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff6b81" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#a81529" stop-opacity="0.55" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="-mt-1 text-2xl font-black uppercase leading-none tracking-tight text-[#a81529] md:text-4xl">Donation Drive 2026</span>
      </div>
    </div>

    <div id="dashboard-root" class="relative mx-auto w-full max-w-4xl rounded-2xl border border-[#c41f36]/30 bg-[#fff5f2]/25 backdrop-blur-sm px-8 pb-10 pt-10">

      <div id="row" class="relative mt-6 mx-auto flex max-w-2xl flex-nowrap justify-center gap-x-4">
        <svg id="pipes" class="pointer-events-none absolute inset-0 h-full w-full overflow-visible"></svg>
        <!-- tubes are injected by JS below -->
      </div>

    </div>
  </div>

<script>
// ---- data: swap this for your live donor counts / API response ----
const departments = [
  { label: "AIDS", value: 28 },
  { label: "AIML", value: 77 },
  { label: "COMPS", value: 91 },
  { label: "CSEDS", value: 89 },
  { label: "EXTC", value: 78 },
  { label: "ICB", value: 35 },
  { label: "IT", value: 86 },
  { label: "MECH", value: 120 },
  { label: "OTHER", value: 75 },
];
const GOAL = 150;

const row = document.getElementById("row");
const hub = document.getElementById("hub");
const pipesSvg = document.getElementById("pipes");

// ---- build tube DOM elements ----
const tubeEls = departments.map((dept, i) => {
  const pct = Math.min(100, (dept.value / GOAL) * 100);

  const wrap = document.createElement("div");
  wrap.className = "flex flex-col items-center gap-2";

  const tube = document.createElement("div");
  tube.className = "relative h-56 w-11 rounded-b-full rounded-t-md border-2 border-white/50 bg-black/20 overflow-hidden shadow-inner";

  const glass = document.createElement("div");
  glass.className = "absolute left-1.5 top-2 h-[85%] w-1 rounded-full bg-white/25";

  const fill = document.createElement("div");
  fill.className = "absolute bottom-0 left-0 right-0 bg-gradient-to-b from-[#f2596b] to-[#c41f36] transition-[height] ease-[cubic-bezier(.22,1,.36,1)] duration-[1800ms] overflow-hidden";
  fill.style.height = "0%";

  // rising bubbles inside the fill for a "filling" feel
  for (let b = 0; b < 3; b++) {
    const bubble = document.createElement("span");
    bubble.className = "bubble";
    bubble.style.left = (20 + Math.random() * 60) + "%";
    bubble.style.width = bubble.style.height = (3 + Math.random() * 4) + "px";
    bubble.style.animationDelay = (Math.random() * 3.2).toFixed(2) + "s";
    bubble.style.animationDuration = (2.6 + Math.random() * 1.4).toFixed(2) + "s";
    fill.appendChild(bubble);
  }

  tube.appendChild(glass);
  tube.appendChild(fill);

  const badge = document.createElement("span");
  badge.className = "rounded-full bg-[#c41f36] px-3 py-1 text-sm font-bold text-white shadow -mt-1";
  badge.textContent = dept.value;

  const label = document.createElement("span");
  label.className = "rounded-md bg-[#c41f36] px-2.5 py-1 text-xs font-bold tracking-wide text-white";
  label.textContent = dept.label;

  wrap.appendChild(tube);
  wrap.appendChild(badge);
  wrap.appendChild(label);
  row.appendChild(wrap);

  setTimeout(() => { fill.style.height = pct + "%"; }, 150 + i * 60);

  return tube;
});

// ---- heartbeat helper: bends a pipe path into a P-Q-R-S-T spike ----
function pulsePathAt(pathEl, centerT, width, amp) {
  const len = pathEl.getTotalLength();
  const steps = 26;
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const p = pathEl.getPointAtLength(t * len);
    let x = p.x, y = p.y;
    const d = (t - centerT) / width;
    if (Math.abs(d) < 1) {
      const before = pathEl.getPointAtLength(Math.max(0, t * len - 2));
      const after = pathEl.getPointAtLength(Math.min(len, t * len + 2));
      const dx = after.x - before.x, dy = after.y - before.y;
      const mag = Math.hypot(dx, dy) || 1;
      const nx = -dy / mag, ny = dx / mag;
      const ad = Math.abs(d);
      let profile = 0;
      if (ad < 0.15) profile = -0.5;
      else if (ad < 0.35) profile = 1;
      else if (ad < 0.55) profile = -1.6;
      else if (ad < 0.75) profile = 0.4;
      x += nx * amp * profile;
      y += ny * amp * profile;
    }
    pts.push(x.toFixed(1) + "," + y.toFixed(1));
  }
  return "M " + pts.join(" L ");
}

// ---- build + animate the pipes once layout has settled ----
let rafIds = [];
function buildPipes() {
  pipesSvg.innerHTML = "";
  rafIds.forEach(cancelAnimationFrame);
  rafIds = [];

  const rowBox = row.getBoundingClientRect();
  const hubBox = hub.getBoundingClientRect();
  const hubX = hubBox.left + hubBox.width / 2 - rowBox.left;
  const hubY = hubBox.bottom - rowBox.top;

  const pipeEls = [];

  departments.forEach((dept, i) => {
    const tubeBox = tubeEls[i].getBoundingClientRect();
    const tubeX = tubeBox.left + tubeBox.width / 2 - rowBox.left;
    const tubeY = tubeBox.top - rowBox.top;
    const midY = hubY + (tubeY - hubY) * 0.55;
    const d = `M ${hubX},${hubY} C ${hubX},${midY} ${tubeX},${midY} ${tubeX},${tubeY}`;

    const pipe = document.createElementNS("http://www.w3.org/2000/svg", "path");
    pipe.setAttribute("d", d);
    pipe.setAttribute("stroke", "#a89f8f");
    pipe.setAttribute("stroke-width", "3");
    pipe.setAttribute("fill", "none");
    pipe.setAttribute("stroke-linecap", "round");
    pipe.setAttribute("opacity", "0.55");
    pipesSvg.appendChild(pipe);
    pipeEls.push(pipe);
  });

  // one shared pulse, reassigned to a random department's pipe every cycle
  const pulse = document.createElementNS("http://www.w3.org/2000/svg", "path");
  pulse.setAttribute("stroke", "#e02840");
  pulse.setAttribute("stroke-width", "2.5");
  pulse.setAttribute("fill", "none");
  pulse.setAttribute("stroke-linecap", "round");
  pulse.setAttribute("stroke-linejoin", "round");
  pipesSvg.appendChild(pulse);

  const CYCLE = 3.2;   // seconds between heartbeats
  const TRAVEL = 0.9;  // how long the single blip takes to travel the pipe
  let start = null;
  let currentCycle = -1;
  let activePipe = pipeEls[Math.floor(Math.random() * pipeEls.length)];

  function frame(ts) {
    if (start === null) start = ts;
    const totalElapsed = (ts - start) / 1000;
    const cycleCount = Math.floor(totalElapsed / CYCLE);
    if (cycleCount !== currentCycle) {
      currentCycle = cycleCount;
      activePipe = pipeEls[Math.floor(Math.random() * pipeEls.length)];
    }
    const elapsed = totalElapsed % CYCLE;
    if (elapsed < TRAVEL) {
      const t = elapsed / TRAVEL;
      pulse.setAttribute("d", pulsePathAt(activePipe, t, 0.14, 7));
    } else {
      pulse.setAttribute("d", "");
    }
    rafIds.push(requestAnimationFrame(frame));
  }
  rafIds.push(requestAnimationFrame(frame));
}

window.addEventListener("load", () => setTimeout(buildPipes, 200));
window.addEventListener("resize", () => setTimeout(buildPipes, 100));
</script>
</body>
</html>
